<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小佳同学</title>
  <style>
    body {
      background-color: #FFB6C1; /* 粉色 */
      text-align: center;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 页面内容居中 */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 让图片大小适中 */
    #mainImage {
      width: 200px;
      transition: all 0.3s ease;
    }

    /* 文字 */
    h1 {
      font-size: 28px;
      color: #68495b;
    }

    /* 按钮样式 */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px; /* 按钮之间的间距 */
      margin-top: 20px;
    }

    button {
      font-size: 18px;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #yes {
      background-color: #d4818e; /* 粉色 */
      color: white;
    }

    #no {
      background-color: #6784b1; /* 蓝色 */
      color: white;
      position: relative;
    }

    /* Yes 完全填满屏幕 */
    .yes-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffdae0; /* 粉色 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body>
<div class="container">
  <img id="mainImage" src="/images/heart.gif" alt="爱心">
  <h1 id="question">可以一直和我玩嘛？</h1>
  <div class="buttons">
    <button id="yes">可以</button>
    <button id="no">不要</button>
  </div>
</div>

<script>
  let yesButton = document.getElementById("yes");
  let noButton = document.getElementById("no");
  let questionText = document.getElementById("question");
  let mainImage = document.getElementById("mainImage");

  let clickCount = 0;  // 记录点击 No 的次数

  // No 按钮的文字变化
  const noTexts = [
    "考虑一下好不好",
    "？真的不考虑一下吗…",
    "再给你一次机会",
    "不可以选这个！",
    "我要生气啦！",
    "不行呜呜呜",
  ];

  // No 按钮点击事件
  noButton.addEventListener("click", function () {
    clickCount++;

    // 让 Yes 变大，每次放大 2 倍
    let yesSize = 1 + (clickCount * 1.2);
    yesButton.style.transform = `scale(${yesSize})`;

    // 挤压 No 按钮，每次右移 100px
    let noOffset = clickCount * 50;
    noButton.style.transform = `translateX(${noOffset}px)`;

    // **新增：让图片和文字往上移动**
    let moveUp = clickCount * 25; // 每次上移 20px
    mainImage.style.transform = `translateY(-${moveUp}px)`;
    questionText.style.transform = `translateY(-${moveUp}px)`;

    // No 文案变化（前 6 次变化）
    if (clickCount <= 6) {
      noButton.innerText = noTexts[clickCount - 1];
    }

    // 图片变化（前 5 次变化）
    if (clickCount === 1) mainImage.src = "/images/happy.GIF"; 
    if (clickCount === 2) mainImage.src = "/images/think.GIF";   
    if (clickCount === 3) mainImage.src = "/images/twice.GIF";   
    if (clickCount === 4) mainImage.src = "/images/sad.GIF";  
    if (clickCount === 5) mainImage.src = "/images/angry.GIF";  
    if (clickCount >= 6) mainImage.src = "/images/cry.GIF";
  });

  
  yesButton.addEventListener("click", function () {
    document.body.innerHTML = `
        <div class="yes-screen">
          <h1 class="yes-text">!!!贴贴!! ( >᎑<)♡︎ᐝ</h1>
          <img src="/images/happy.GIF" alt="拥抱" class="yes-image">
        </div>
      `;

    document.body.style.overflow = "hidden";
  });
</script>
</body>

</html>
